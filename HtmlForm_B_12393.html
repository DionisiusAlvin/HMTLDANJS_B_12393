<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML Form - 12393</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <ul class="menu">
      <li><a href="HtmlCssBasic_B_12393.html" onclick="return confirm ('Apakah andai yakin ingin kembali ke Halaman Utama?')">Kembali ke Halaman Utama</a></li>
      <li><a href="JSBasic_B_12393.html">Halaman Javascript</a></li>
  </ul>

  <h2>Form Pendaftaran Mahasiswa</h2>

  <form onsubmit="return validateForm()">
    <table cellspacing="4" cellpadding="4">
      <!-- TODO: Tambahkan field input teks untuk Nama Mahasiswa dengan tipe teks dan WAJIB DIISI. -->
      <tr>
        <td>
          <p><strong>Nama Mahasiswa</strong></p>
        </td>

        <td>
          <input type="text" id="namamhs" name="namamhs" size="40" required>
        </td>
      </tr>
      
      <!-- TODO: Tambahkan field radio button untuk Jenis Kelamin (Laki-laki dan Perempuan) dan WAJIB DIISI -->
      <!-- Jenis Kelamin -->
      <tr>
        <td>
          <p><strong>Jenis Kelamin</strong></p>
        </td>

        <td>
          <input type="radio" id="Laki-laki" name="Jenis Kelamin" value="Laki-laki" required>
          <label for="Laki-laki">Laki-laki</label>

          <input type="radio", id="Perempuan" name="Jenis Kelamin" value="Perempuan" required>
          <label for="Perempuan">Perempuan</label>
        </td>
      </tr>
      <!-- TODO: Tambahkan dropdown untuk Program Studi dengan id="prodi", 
          opsi: "Pilih Prodi", "Informatika", "Teknik Industri", "Sistem Informasi" dan WAJIB DIISI. -->
      <!-- Program Studi -->
      <tr>
        <td>
          <p><strong>Program Studi</strong></p>
        </td>

        <td>
          <select name="prodi" id="prodi" required>
            <option value="">Pilih Prodi. . .</option>
            <option value="Informatika">Informatika</option>
            <option value="Teknik Industri">Teknik Industri</option>
            <option value="Sistem Informasi">Sistem Informasi</option>
          </select>
        </td>
      </tr>

      <!-- TODO: Tambahkan field input angka untuk Nomor Telepon dengan tipe number dan WAJIB DIISI. -->
      <tr>
        <td>
          <p><strong>Nomor Telepon</strong></p>
        </td>

        <td>
          <input type="number" name="Nomor Telepon" id="Nomor Telepon" size="16" required>
        </td>
      </tr>
          
      <!-- TODO: Tambahkan field input tanggal untuk Tanggal Lahir dengan tipe date dan WAJIB DIISI. -->
      <tr>
        <td>
          <p><strong>Tanggal Lahir</strong></p>
        </td>
        <td>
          <input type="date" id="Tanggal Lahir" name="Tanggal Lahir" required>
        </td>
      </tr>
        
      <!-- TODO: Tambahkan field input email dengan tipe email dan WAJIB DIISI. -->
      <tr>
        <td>
          <p><strong>Email</strong></p>
        </td>

        <td>
          <input type="email" name="email" id="email" required>
        </td>
      </tr>
        
      <!-- TODO: Tambahkan field input password dengan tipe password dan WAJIB DIISI. -->
      <tr>
        <td>
          <p><strong>Password</strong></p>
        </td>
        
        <td>
          <input type="password" name="password" id="password" required>
        </td>
      </tr>

      <!-- TODO: Tambahkan fieldset untuk Hal Favorit, berisi:
          - Fieldset "Game" dengan checkbox untuk Roblox, Magic Chess, dan beberapa game lain yang ingin kamu tambahkan.
          - Fieldset "Film" dengan checkbox untuk Drama, Action, Romance, Comedy, Horror.
      -->
        <tr>
          <td>
            <p><strong>Hal Favorit</strong></p>          
          </td>
          
          <td>       
            <fieldset>
                <legend><strong>Games</strong></legend>
                <input type="checkbox" name="Hal Favorit" value="Roblox">
                <label for="Hal Favorit1">Roblox</label><br>

                <input type="checkbox" name="Hal Favorit" value="Magic Chess">
                <label for="Hal Favorit2">Magic Chess</label><br> 
              
                <input type="checkbox" name="Hal Favorit" value="Pub3GeH">
                <label for="Hal Favorit3">Pub3geH</label><br>
                
                <input type="checkbox" name="Hal Favorit" value="Counter Legends">
                <label for="Hal Favorit4">Counter Legends</label><br> 
            </fieldset><br>
              
            <fieldset>
                <legend><strong>Film</strong></legend>
                <input type="checkbox" name="Film Favorit" value="Drama">
                <label for="Film Favorit1">Drama</label><br>

                <input type="checkbox" name="Film Favorit" value="Action">
                <label for="Film Favorit2">Action</label><br> 
              
                <input type="checkbox" name="Film Favorit" value="Romance">
                <label for="Film Favorit3">Romance</label><br>
                
                <input type="checkbox" name="Film Favorit" value="Comedy">
                <label for="Film Favorit4">Comedy</label><br> 
            </fieldset>
          </td>
        </tr>
      <!-- TODO: Tambahkan textarea untuk Deskripsi dengan id="deskripsi" dan WAJIB DIISI. -->
      <tr>
        <td>
          <p><strong>Deskripsi</strong></p>
        </td>  
        <td>
          <textarea name="deskripsi" id="deskripsi" rows="5" cols="40" required></textarea>
        </td>
      </tr>
      <!-- TODO: Tambahkan field input Foto dengan tipe file dan WAJIB DIISI. -->
      
      <tr>
        <td>
          <p><strong>Foto</strong></p>
        </td>

        <td>
          <input type="file" id="Foto" name="Foto" accept=".jpg, .png" required>
        </td>
      </tr>
      <!-- TODO: Tambahkan tombol submit dengan id="simpan" dan value="Simpan". -->
      <tr>
        <td colspan="2">
          <input type="submit" value="Simpan" id="simpan">   
        </td>
      </tr>

      <!-- Contoh Field input : 
            <tr>
              <td><strong>Nama Mahasiswa</strong></td>
              <td><input required type="text" id="namamhs" name="namamhs" size="30" /></td>
            </tr> 
      -->
    </table>
  </form>

  <script>
    const validateForm = () =>alert("Data Berhasil Disimpan !");
  </script>
</body>
</html>
